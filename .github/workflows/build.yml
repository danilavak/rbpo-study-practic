name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build
        run: ./mvnw clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-management-jar
          path: ./target/*.jar

  sast:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run SAST
        run: semgrep scan --metrics=off --config semgrep/rules.yml --sarif --sarif-output semgrep.sarif . || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  sca:
    runs-on:
      - self-hosted
      - Windows
      - X64
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        run: |
          echo "JAVA_HOME=C:\Users\danil\.jdks\openjdk-25" >> $env:GITHUB_ENV
          echo "C:\Users\danil\.jdks\openjdk-25\bin" >> $env:GITHUB_PATH
        shell: powershell

      - name: Prepare Maven Wrapper
        run: |
          .\mvnw.cmd -version
        shell: powershell

      - name: Run SCA
        run: |
          .\mvnw.cmd -B dependency-check:check -DautoUpdate=false -DdataDirectory=C:\Users\danil\.m2\repository\org\owasp\dependency-check-data\11.0
          if (-not (Test-Path 'target\dependency-check-report.html')) {
            '<html><body>Dependency-Check report was not generated.</body></html>' | Set-Content -Path 'target\dependency-check-report.html'
          }
        shell: powershell

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

variables:
  JAVA_HOME: /c/Users/danil/.jdks/openjdk-25

default:
  before_script:
    - export PATH="$JAVA_HOME/bin:$PATH"

stages:
  - verify
  - container
  - build
  - publish
  - test

secret_scan:
  stage: verify
  tags:
    - saas-linux-small-amd64
  script:
    - mkdir -p target/secrets
    - curl -fsSL -o target/secrets/gitleaks.zip https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_windows_x64.zip
    - py -c "import zipfile; zipfile.ZipFile(r'target/secrets/gitleaks.zip').extractall(r'target/secrets/gitleaks-bin')"
    - ./target/secrets/gitleaks-bin/gitleaks.exe git . --report-format json --report-path target/secrets/gitleaks-report.json --exit-code 1
  artifacts:
    when: always
    paths:
      - target/secrets/gitleaks-report.json

container_scan:
  stage: container
  tags:
    - saas-linux-small-amd64
  needs:
    - secret_scan
  script:
    - mkdir -p target/container
    - curl -fsSL -o target/container/trivy.zip https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_windows-64bit.zip
    - py -c "import zipfile; zipfile.ZipFile(r'target/container/trivy.zip').extractall(r'target/container/trivy-bin')"
    - ./target/container/trivy-bin/trivy.exe config --severity HIGH,CRITICAL --exit-code 1 --format json --output target/container/trivy-report.json Dockerfile
  artifacts:
    when: always
    paths:
      - target/container/trivy-report.json

publish_container:
  stage: publish
  tags:
    - saas-linux-small-amd64
  needs:
    - container_scan
    - job: build
      artifacts: true
  script:
    - chmod +x ./mvnw
    - export IMAGE_NAME="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - ./mvnw -B -DskipTests jib:build -Djib.containerizingMode=packaged -Djib.to.image="$IMAGE_NAME" -Djib.to.auth.username="$CI_REGISTRY_USER" -Djib.to.auth.password="$CI_REGISTRY_PASSWORD"

build:
  stage: build
  tags:
    - saas-linux-small-amd64
  needs:
    - secret_scan
    - container_scan
  image: eclipse-temurin:21-jdk
  script:
    - chmod +x ./mvnw
    - ./mvnw clean package
  artifacts:
    paths:
      - ./target/*.jar

sast:
  stage: test
  tags:
    - saas-linux-small-amd64
  script:
    - chmod +x ./mvnw
    - py -m pip install --user semgrep
    - export PATH="/c/Users/danil/AppData/Roaming/Python/Python312/Scripts:$PATH"
    - semgrep.exe scan --metrics=off --config semgrep/rules.yml --gitlab-sast --gitlab-sast-output gl-sast-report.json . || true
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json

sca:
  stage: test
  tags:
    - saas-linux-small-amd64
  image: eclipse-temurin:21-jdk
  script:
    - chmod +x ./mvnw
    - ./mvnw -B dependency-check:check -DautoUpdate=false -DossindexAnalyzerEnabled=false -DdataDirectory=C:/Users/danil/.m2/repository/org/owasp/dependency-check-data/11.0
    - if [ ! -f target/dependency-check-report.html ]; then printf '<html><body>Dependency-Check report was not generated.</body></html>' > target/dependency-check-report.html; fi
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html

dast_baseline:
  stage: test
  tags:
    - saas-linux-small-amd64
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  needs:
    - job: build
      artifacts: true
  script:
    - mkdir -p target/zap .zap
    - touch .zap/rules.tsv
    - trap 'if [ -f target/zap/app.pid ]; then kill "$(cat target/zap/app.pid)" || true; fi' EXIT
    - java -jar target/*.jar > target/zap/app.log 2>&1 &
    - echo $! > target/zap/app.pid
    - sleep 30
    - curl --fail --silent http://localhost:8080/actuator/health > /dev/null
    - zap-baseline.py -t http://localhost:8080 -c .zap/rules.tsv -r target/zap/zap-baseline-report.html -w target/zap/zap-baseline-report.md -J target/zap/zap-baseline-report.json || true
  after_script:
    - if [ -f target/zap/app.pid ]; then kill "$(cat target/zap/app.pid)" || true; fi
  artifacts:
    when: always
    paths:
      - target/zap/zap-baseline-report.html
      - target/zap/zap-baseline-report.md
      - target/zap/zap-baseline-report.json
      - target/zap/app.log

dast_api:
  stage: test
  tags:
    - saas-linux-small-amd64
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  needs:
    - job: build
      artifacts: true
  script:
    - mkdir -p target/zap .zap
    - touch .zap/rules.tsv
    - trap 'if [ -f target/zap/app.pid ]; then kill "$(cat target/zap/app.pid)" || true; fi' EXIT
    - java -jar target/*.jar > target/zap/app.log 2>&1 &
    - echo $! > target/zap/app.pid
    - sleep 30
    - curl --fail --silent http://localhost:8080/actuator/health > /dev/null
    - zap-api-scan.py -t http://localhost:8080/v3/api-docs -f openapi -c .zap/rules.tsv -r target/zap/zap-api-report.html -w target/zap/zap-api-report.md -J target/zap/zap-api-report.json || true
  after_script:
    - if [ -f target/zap/app.pid ]; then kill "$(cat target/zap/app.pid)" || true; fi
  artifacts:
    when: always
    paths:
      - target/zap/zap-api-report.html
      - target/zap/zap-api-report.md
      - target/zap/zap-api-report.json
      - target/zap/app.log

fuzzing:
  stage: test
  tags:
    - saas-linux-small-amd64
  needs:
    - job: build
      artifacts: true
  script:
    - mkdir -p target/fuzzing
    - curl -fsSL -o target/fuzzing/ffuf.zip https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_windows_amd64.zip
    - py -c "import zipfile; zipfile.ZipFile(r'target/fuzzing/ffuf.zip').extractall(r'target/fuzzing/ffuf-bin')"
    - trap 'if [ -f target/fuzzing/app.pid ]; then kill "$(cat target/fuzzing/app.pid)" || true; fi' EXIT
    - java -jar target/*.jar > target/fuzzing/app.log 2>&1 &
    - echo $! > target/fuzzing/app.pid
    - sleep 30
    - curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null
    - ./target/fuzzing/ffuf-bin/ffuf.exe -w fuzzing/paths.txt -u http://127.0.0.1:8080/FUZZ -mc all -fc 404 -maxtime 60 -timeout 5 -o target/fuzzing/ffuf-report.json -of json -debug-log target/fuzzing/ffuf-debug.log || true
  after_script:
    - if [ -f target/fuzzing/app.pid ]; then kill "$(cat target/fuzzing/app.pid)" || true; fi
  artifacts:
    when: always
    paths:
      - target/fuzzing/ffuf-report.json
      - target/fuzzing/ffuf-debug.log
      - target/fuzzing/app.log
